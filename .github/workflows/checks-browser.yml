# The browser tests of a pull request: web/'s `pnpm test:e2e`,
# `pnpm test:ui` and `pnpm test:worker`, the headless Chrome with the fake
# card, the fake component and the Worker in the local workerd (#69; items
# of the definition of done in CONTRIBUTING.md). The other items run in
# checks.yml, on every pull request. The first two took about 16 minutes on
# GitHub's runner when they ran against the Go server (#119), so they run
# only when the pull request changes a file they use (#123).
#
# The same rules as checks.yml, but not on merge_group: these do not run in
# the merge queue (#180). Triggered by pull_request only, never
# pull_request_target; read-only; no secret; nothing cached; ASCII only.
# worker/test/workflows.test.ts checks this file against the rules in
# worker/test/workflows.ts, and checks that `paths` holds every top-level
# directory and file the three tests use (read from their source and the Go
# packages they build: now only cmd/iamreal-verify, which re-verifies what
# the Worker published).
#
# `paths`: the workflow runs if at least one changed file matches a pattern;
# `**` matches any characters, `/` included, and a pattern matches the whole
# path from the repository's root (GitHub's workflow syntax,
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushpull_requestpull_request_targetpathspaths-ignore).
# A workflow skipped by `paths` reports no check: if this check
# is ever made required for merging, a pull request it skips waits forever
# (.github/README.md).
name: checks-browser

on:
  pull_request:
    paths:
      - web/**
      - protocol/**
      - design/**
      - spec/**
      - worker/**
      - verifier/**
      - roster/**
      - crl/**
      - cmd/**
      - go.mod
      - go.sum
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - circuits/package.json
      - .npmrc
      - .pnpmfile.cjs
      - package.json
      - go.work
      - go.work.sum
      - .cargo/config.toml
      - .gitattributes
      - .github/workflows/checks-browser.yml

permissions:
  contents: read

# No cache is restored or saved, by any step (GitHub's "Workflow syntax",
# cache-mode; .github/README.md).
cache-mode: none

# Not the group of checks.yml: "concurrency group names must be unique across workflows to avoid
# canceling in-progress jobs or runs from other workflows" (GitHub's workflow syntax,
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency).
concurrency:
  group: checks-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # bb 6.0.0, as in checks.yml; the job checks its SHA-256 before using it.
  IAMREAL_BB: ${{ github.workspace }}/web/node_modules/@aztec-foundation/bb.js/build/amd64-linux/bb

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The runner image installs Google Chrome there (actions/runner-images,
      # images/ubuntu/scripts/build/install-google-chrome.sh, sets CHROME_BIN=/usr/bin/google-chrome).
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm test:ui builds iamreal-verify, which re-verifies the roster the Worker published.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - run: pnpm install --frozen-lockfile
      - name: bb is the one of bb.js 6.0.0
        run: echo "5bbb64800d431c6760a70d8723be4eaf37ed10e8fbfe2842bb85b8436180c130  $IAMREAL_BB" | sha256sum --check --strict
      - name: Chrome
        run: '"$CHROME" --version'
      # The common reference string the page proves with, checked against its SHA-256 (web/README.md).
      - name: web/ fetch-crs
        working-directory: web
        run: pnpm fetch-crs
      - name: web/ test:e2e
        working-directory: web
        run: pnpm test:e2e
      - name: web/ test:ui
        working-directory: web
        run: pnpm test:ui
      - name: web/ test:worker
        working-directory: web
        run: pnpm test:worker
