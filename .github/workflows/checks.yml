# The checks of a pull request: the items of the definition of done in
# CONTRIBUTING.md (ADR-0029, on pull requests from outside), on every pull
# request. web/'s browser tests (`pnpm test:e2e`, `pnpm test:ui`) are in
# checks-browser.yml, which runs only when a file they use changes. The
# workflows are ASCII only, comments included (worker/test/workflows.ts).
#
# Triggered by pull_request only, never pull_request_target: a pull request
# from a fork gets no secret and a read-only GITHUB_TOKEN. Nothing here
# refers to a secret, and nothing is cached, so a pull request writes nothing
# another run reads (GitHub's "Events that trigger workflows", pull_request,
# "Workflows in forked repositories"). worker/test/workflows.test.ts checks this file against
# the rules in worker/test/workflows.ts.
name: checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # bb 6.0.0, the native executable that comes in the package
  # @aztec-foundation/bb.js 6.0.0 (pnpm-lock.yaml), for Linux on x86-64. Each
  # job checks its SHA-256 before using it (the value: worker/test/workflows.ts).
  IAMREAL_BB: ${{ github.workspace }}/web/node_modules/@aztec-foundation/bb.js/build/amd64-linux/bb
  # wrangler sends Cloudflare no usage report and asks npm for no newer version (worker/README.md, on packages).
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_HIDE_BANNER: "true"

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - name: Install the packages (for bb)
        run: pnpm install --frozen-lockfile
      - name: bb is the one of bb.js 6.0.0
        run: echo "5bbb64800d431c6760a70d8723be4eaf37ed10e8fbfe2842bb85b8436180c130  $IAMREAL_BB" | sha256sum --check --strict
      - run: go build ./...
      - run: go vet -tags iamrealtest ./...
      - name: gofmt -l . prints nothing
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go test -count=1 -tags iamrealtest ./...

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # worker/test/compare.test.ts runs the Go verifier's tests and the native bb; without Go
      # and IAMREAL_BB it is skipped.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - run: pnpm install --frozen-lockfile
      - name: bb is the one of bb.js 6.0.0
        run: echo "5bbb64800d431c6760a70d8723be4eaf37ed10e8fbfe2842bb85b8436180c130  $IAMREAL_BB" | sha256sum --check --strict
      - name: protocol/ typecheck
        working-directory: protocol
        run: pnpm typecheck
      - name: protocol/ test
        working-directory: protocol
        run: pnpm test
      - name: worker/ typecheck
        working-directory: worker
        run: pnpm typecheck
      - name: worker/ test
        working-directory: worker
        run: pnpm test
      - name: web/ typecheck
        working-directory: web
        run: pnpm typecheck
      - name: web/ test
        working-directory: web
        run: pnpm test

  # device-core/: the Rust core of the apps. It installs no package of npm and
  # uses no bb: the Barretenberg it links is the static library that
  # fetch-barretenberg.sh downloads and checks against barretenberg.sha256.
  device-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libc++ (Barretenberg's static library is built with it)
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libc++-dev libc++abi-dev
      - name: Install the Rust of rust-toolchain.toml
        working-directory: device-core
        run: rustup toolchain install
      - name: cargo fmt --check
        working-directory: device-core
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: device-core
        run: BB_LIB_DIR="$(./fetch-barretenberg.sh)" && export BB_LIB_DIR && cargo clippy --locked --release --all-targets -- -D warnings
      - name: cargo test
        working-directory: device-core
        run: BB_LIB_DIR="$(./fetch-barretenberg.sh)" && export BB_LIB_DIR && cargo test --locked --release

  # android/: the Android app. The native library is device-core/ and the JNI
  # layer, linked by the Zig that android/fetch-zig.sh downloads and checks
  # against android/zig.sha256; Gradle is the one gradle-wrapper.properties
  # names, checked against the SHA-256 written there; every plugin and library
  # Gradle downloads is checked against android/gradle/verification-metadata.xml.
  # `build` assembles both installers, runs the unit tests on the JVM against
  # the same Rust, runs lint, and checks what was built (android/README.md).
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libc++ (Barretenberg's static library is built with it)
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libc++-dev libc++abi-dev
      - name: Install the Rust of rust-toolchain.toml, with the targets of Android
        working-directory: device-core
        run: rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install the parts of the Android SDK that android/app/build.gradle.kts names
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Get the parameter files
        working-directory: device-core
        run: ./fetch-crs.sh
      - name: gradlew build
        working-directory: android
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon build
