# The checks of a pull request: the items of the definition of done in
# CONTRIBUTING.md (ADR-0029, on pull requests from outside), on every pull
# request. web/'s browser tests (`pnpm test:e2e`, `pnpm test:ui`) are in
# checks-browser.yml, which runs only when a file they use changes. The
# workflows are ASCII only, comments included (worker/test/workflows.ts).
#
# Triggered by pull_request only, never pull_request_target: a pull request
# from a fork gets no secret and a read-only GITHUB_TOKEN. Nothing here
# refers to a secret, and nothing is cached, so a pull request writes nothing
# another run reads (GitHub's "Events that trigger workflows", pull_request,
# "Workflows in forked repositories"). worker/test/workflows.test.ts checks this file against
# the rules in worker/test/workflows.ts.
name: checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # bb 6.0.0, the native executable that comes in the package
  # @aztec-foundation/bb.js 6.0.0 (pnpm-lock.yaml), for Linux on x86-64. Each
  # job checks its SHA-256 before using it (the value: worker/test/workflows.ts).
  IAMREAL_BB: ${{ github.workspace }}/web/node_modules/@aztec-foundation/bb.js/build/amd64-linux/bb
  # wrangler sends Cloudflare no usage report and asks npm for no newer version (worker/README.md, on packages).
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_HIDE_BANNER: "true"

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - name: Install the packages (for bb)
        run: pnpm install --frozen-lockfile
      - name: bb is the one of bb.js 6.0.0
        run: echo "5bbb64800d431c6760a70d8723be4eaf37ed10e8fbfe2842bb85b8436180c130  $IAMREAL_BB" | sha256sum --check --strict
      - run: go build ./...
      - run: go vet -tags iamrealtest ./...
      - name: gofmt -l . prints nothing
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go test -count=1 -tags iamrealtest ./...

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # worker/test/compare.test.ts runs the Go verifier's tests and the native bb; without Go
      # and IAMREAL_BB it is skipped.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - run: pnpm install --frozen-lockfile
      - name: bb is the one of bb.js 6.0.0
        run: echo "5bbb64800d431c6760a70d8723be4eaf37ed10e8fbfe2842bb85b8436180c130  $IAMREAL_BB" | sha256sum --check --strict
      - name: protocol/ typecheck
        working-directory: protocol
        run: pnpm typecheck
      - name: protocol/ test
        working-directory: protocol
        run: pnpm test
      - name: worker/ typecheck
        working-directory: worker
        run: pnpm typecheck
      - name: worker/ test
        working-directory: worker
        run: pnpm test
      - name: web/ typecheck
        working-directory: web
        run: pnpm typecheck
      - name: web/ test
        working-directory: web
        run: pnpm test
