# Deploys the test site (the Worker iamreal-test, test.iamreal.tw) with each
# push to main (ADR-0029). worker/README.md, the section on deploying from
# GitHub Actions, has the details; worker/test/workflows.ts holds this
# file's two jobs, exactly, and worker/test/workflows.test.ts checks this
# file against them.
#
# "build" has no token. It runs the repository's code: scripts/build-deploy.ts
# builds the card proof page (web/'s build for the test site, after it
# downloads the common reference string and checks it against its SHA-256)
# into worker/site/proof/ and checks it, makes the deploy build of the
# Worker the way `pnpm run deploy:test` does (the proof verifier's files
# checked against their SHA-256, then a wrangler dry run) and checks it,
# then hands both on as artifacts.
#
# "connection-log" has a token of its own, CLOUDFLARE_API_TOKEN_TEST_R2_READ,
# which can read the settings of R2 buckets and nothing else; the deploy's
# token is not in it. It runs one script of the repository,
# worker/scripts/check-connection-log.ts, which imports nothing but Node's
# own modules (the job installs no package): it reads back the lifecycle
# rules of the bucket the connection log is written to and fails unless one
# rule deletes what is under connection/ after 31 days (ADR-0022). "deploy"
# waits for it: a Worker that writes IP addresses is not uploaded while
# nothing deletes them.
#
# "deploy" uploads the Worker's build as it is, and with it the files of
# worker/site/ (Static Assets; worker/README.md, "Static Assets"): the
# style sheet, copy.js, _headers and _redirects from its own checkout, and under
# proof/ the card proof page "build" handed on. Only its last step has the token
# (the repository's CLOUDFLARE_API_TOKEN_TEST and CLOUDFLARE_ACCOUNT_ID).
# Before that step the job runs the pinned actions, npm installing pnpm
# before the repository is checked out, and pnpm installing the packages
# of the lockfile with no install script and no .pnpmfile.cjs; it runs no
# script of the repository. What it still trusts: the pinned actions;
# pnpm 10.16.1 as npm's registry serves it (no hash is checked); the
# packages of pnpm-lock.yaml, wrangler among them, as pnpm-workspace.yaml
# and the lockfile describe them; wrangler.jsonc, which wrangler reads
# when it uploads (it has no build command: wrangler would run it); and
# worker/site/, which it uploads ("build" checked the four files of the
# repository at the same commit, and the page it handed on).
name: deploy-test

on:
  push:
    branches:
      - main

permissions:
  contents: read

# No cache is restored or saved, by any step (GitHub's "Workflow syntax",
# cache-mode; .github/README.md).
cache-mode: none

# One deploy at a time, the newest last; a running one is not stopped halfway.
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Build the card proof page and the Worker, and check both builds
        working-directory: worker
        run: node --experimental-strip-types scripts/build-deploy.ts "$RUNNER_TEMP/worker-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: ${{ runner.temp }}/worker-build
          if-no-files-found: error
      # The card proof page, built and checked in worker/site/proof/ (not in the repository).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-page
          path: worker/site/proof
          if-no-files-found: error

  connection-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      # No package is installed: the script imports Node's own modules only.
      - name: The connection log's bucket deletes what is under connection/ after 31 days
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST_R2_READ }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/check-connection-log.ts test

  deploy:
    needs:
      - build
      - connection-log
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Node and pnpm before the checkout: no file of the repository (an .npmrc) is there yet.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      # wrangler.jsonc has the bindings; the lockfile has wrangler.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install wrangler
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org/ --filter iamreal-worker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: ${{ runner.temp }}/worker-build
      # The card proof page, to where wrangler reads the files of Static Assets from (wrangler.jsonc, assets.directory).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proof-page
          path: worker/site/proof
      # The build's index.js and the modules next to it, as they are (--no-bundle), with the
      # bindings of wrangler.jsonc. The arguments are uploadArgs of worker/scripts/deploy.ts;
      # --env-file=/dev/null keeps wrangler from loading a .env file of the checkout.
      - name: Upload to iamreal-test
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: WRANGLER_SEND_METRICS=false WRANGLER_HIDE_BANNER=true node_modules/.bin/wrangler deploy "$RUNNER_TEMP/worker-build/index.js" --no-bundle --config wrangler.jsonc --env test --experimental-provision=false --env-file=/dev/null
