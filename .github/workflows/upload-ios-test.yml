# Builds the test app of the iPhone (tw.iamreal.app.test, ADR-0040) and
# uploads it to App Store Connect, from where TestFlight hands it to the
# operator (#484). The same two jobs as upload-ios.yml, which uploads the
# production app, but its own workflow: GitHub counts each workflow's runs
# on its own, so the test app's build numbers do not take turns with the
# production app's. Only by hand: the operator, or the coding agent on the
# operator's computer, starts it on main with
# `gh workflow run upload-ios-test.yml --ref main`. ios/README.md has the
# details; worker/test/workflows.ts holds this file's two jobs, exactly, and
# worker/test/workflows.test.ts checks this file against them.
#
# "build" has no key. It runs the repository's code: ios/build-core.sh
# (device-core/ for an iPhone, Barretenberg's library and the CRS checked
# against their SHA-256), then ios/archive.sh --test-app, which archives the
# TestApp configuration unsigned, with the date in Taiwan as the version and
# this workflow's run number and 1,000,000 as the build (ADR-0040, on the
# test site's lowest version: above every build of the production app
# before launch), and checks the archive (ios/check-archive.sh --test-app:
# the test app's identifier and build range, the test site, no fake card,
# no library of the tests). The identifier comes from the configuration
# (ios/Config/Test.xcconfig); this workflow does not give it. It hands
# on the archive, in a tar file so that its files keep their modes, with
# ios/ExportOptions.plist.
#
# "upload" runs in the environment app-test, with the same App Store
# Connect API key as upload-ios.yml (ADR-0040: one environment for both
# apps), which only main's runs get. It does not check out the repository
# and runs no script of it: it unpacks what "build" handed on and signs and
# uploads it as upload-ios.yml does (signingStyle manual, #143): the same
# Apple Distribution certificate, and the App Store profile of
# tw.iamreal.app.test, its own secret. Each secret is in the env of the one
# step that uses it; the App Store Connect key only in the last. What it
# trusts: the pinned action, the runner's Xcode and tools, and the archive
# and export options "build" made from the same commit.
name: upload-ios-test

on:
  workflow_dispatch:

permissions:
  contents: read

# No cache is restored or saved, by any step (GitHub's "Workflow syntax",
# cache-mode; .github/README.md).
cache-mode: none

# One upload at a time, none stopped halfway.
concurrency:
  group: upload-ios-test
  cancel-in-progress: false

env:
  # The one Xcode the app is built with (ios/README.md), by its path on the runner's image.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust of rust-toolchain.toml, with the iPhone's target
        working-directory: device-core
        run: rustup toolchain install && rustup target add aarch64-apple-ios
      - name: Build device-core/ for the iPhone
        working-directory: ios
        run: ./build-core.sh device
      - name: Archive the test app and check it
        working-directory: ios
        run: ./archive.sh --test-app "$RUNNER_TEMP/IamrealApp.xcarchive" "$((GITHUB_RUN_NUMBER + 1000000))"
      - name: Pack the archive, keeping its files' modes, with the export options
        run: mkdir "$RUNNER_TEMP/ios-upload" && tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/ios-upload/IamrealApp.xcarchive.tar" IamrealApp.xcarchive && cp ios/ExportOptions.plist "$RUNNER_TEMP/ios-upload/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-upload
          path: ${{ runner.temp }}/ios-upload
          if-no-files-found: error

  upload:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    environment: app-test
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-upload
          path: ${{ runner.temp }}/ios-upload
      - name: Unpack the archive
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/ios-upload/IamrealApp.xcarchive.tar"
      # The archive is unsigned and names no team: the export is told which, from the
      # environment's variable APPLE_TEAM_ID (not a key; every signed app shows it).
      - name: Name the team in the export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: test -n "$APPLE_TEAM_ID" && plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ios-upload/ExportOptions.plist"
      # The Apple Distribution certificate the operator made, and its key, into a keychain of this
      # job's own, with a password made for this run; only codesign may use the key, and the
      # .p12 is removed once imported. GitHub destroys the runner after the job (#143, ADR-0036).
      - name: Put the distribution certificate in a keychain of this job's own
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: umask 077 && printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12" && password="$(openssl rand -hex 24)" && security create-keychain -p "$password" "$RUNNER_TEMP/signing.keychain-db" && security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db" && security unlock-keychain -p "$password" "$RUNNER_TEMP/signing.keychain-db" && security import "$RUNNER_TEMP/dist.p12" -k "$RUNNER_TEMP/signing.keychain-db" -f pkcs12 -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign && rm "$RUNNER_TEMP/dist.p12" && security set-key-partition-list -S 'apple-tool:,apple:' -s -k "$password" "$RUNNER_TEMP/signing.keychain-db" > /dev/null && security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" && security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | grep -q 'Apple Distribution'
      # The App Store profile the operator made: it must be for this app under the team and allow
      # the NFC tag reading the app asks for; the export options name it for the identifier.
      - name: Install the App Store profile of tw.iamreal.app.test and name it in the export options
        env:
          IOS_TEST_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_TEST_APPSTORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: printf '%s' "$IOS_TEST_APPSTORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision" && security cms -D -i "$RUNNER_TEMP/app.mobileprovision" -o "$RUNNER_TEMP/profile.plist" && test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")" = "$APPLE_TEAM_ID.tw.iamreal.app.test" && /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.nfc.readersession.formats' "$RUNNER_TEMP/profile.plist" | grep -qw TAG && uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")" && mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles" && cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision" && cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision" && /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' -c "Add :provisioningProfiles:tw.iamreal.app.test string $uuid" "$RUNNER_TEMP/ios-upload/ExportOptions.plist"
      # The archive is unsigned, so the signed app is the first place its entitlements can be
      # seen: signed once without uploading, it must carry the NFC tag reading, exactly TAG as
      # ios/Config/IamrealApp.entitlements has it, no more and no less, and the identifier.
      - name: Sign without uploading, and check that the app has its NFC entitlement
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: cp "$RUNNER_TEMP/ios-upload/ExportOptions.plist" "$RUNNER_TEMP/check.plist" && plutil -replace destination -string export "$RUNNER_TEMP/check.plist" && xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/IamrealApp.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/check.plist" -exportPath "$RUNNER_TEMP/check" && unzip -q "$RUNNER_TEMP"/check/*.ipa -d "$RUNNER_TEMP/ipa" && codesign -d --entitlements - --xml "$RUNNER_TEMP/ipa/Payload/IamrealApp.app" > "$RUNNER_TEMP/entitlements.plist" && test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.formats:0' "$RUNNER_TEMP/entitlements.plist")" = TAG && ! /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.formats:1' "$RUNNER_TEMP/entitlements.plist" > /dev/null 2>&1 && test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/entitlements.plist")" = "$APPLE_TEAM_ID.tw.iamreal.app.test"
      # The key to a file only this job's runner has, then Xcode's export: it signs again with
      # the certificate and the profile above (signingStyle manual) and uploads
      # (ExportOptions.plist: destination upload).
      - name: Sign and upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: umask 077 && printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/key.p8" && xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/IamrealApp.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ios-upload/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/key.p8" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
