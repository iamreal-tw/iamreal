# Builds the test app of the iPhone (tw.iamreal.app.test, ADR-0040) and
# uploads it to App Store Connect, from where TestFlight hands it to the
# operator (#484). The same two jobs as upload-ios.yml, which uploads the
# production app, but its own workflow: GitHub counts each workflow's runs
# on its own, so the test app's build numbers do not take turns with the
# production app's. Only by hand: the operator, or the coding agent on the
# operator's computer, starts it on main with
# `gh workflow run upload-ios-test.yml --ref main`. ios/README.md has the
# details; worker/test/workflows.ts holds this file's two jobs, exactly, and
# worker/test/workflows.test.ts checks this file against them.
#
# "build" has no key. It runs the repository's code: ios/build-core.sh
# (device-core/ for an iPhone, Barretenberg's library and the CRS checked
# against their SHA-256), then ios/archive.sh --test-app, which archives the
# TestApp configuration unsigned, with the date in Taiwan as the version and
# this workflow's run number and 1,000,000 as the build (ADR-0040, on the
# test site's lowest version: above every build of the production app
# before launch), and
# checks the archive (ios/check-archive.sh --test-app: the test app's
# identifier and build range, the test site, no fake card, no library of the
# tests). The identifier is the configuration's, not written here. It hands
# on the archive, in a tar file so that its files keep their modes, with
# ios/ExportOptions.plist.
#
# "upload" runs in the environment app-test, with the same App Store
# Connect API key as upload-ios.yml (ADR-0040: one environment for both
# apps), which only main's runs get. It does not check out the repository
# and runs no script of it: it unpacks what "build" handed on and gives it
# to Xcode's own export, which signs it with a distribution certificate
# Apple keeps (cloud-managed, signingStyle automatic) and uploads it, for
# the team the environment's variable APPLE_TEAM_ID names. Only its last
# step has the key. What it trusts: the pinned action, the runner's Xcode,
# and the archive and export options "build" made from the same commit.
name: upload-ios-test

on:
  workflow_dispatch:

permissions:
  contents: read

# No cache is restored or saved, by any step (GitHub's "Workflow syntax",
# cache-mode; .github/README.md).
cache-mode: none

# One upload at a time, none stopped halfway.
concurrency:
  group: upload-ios-test
  cancel-in-progress: false

env:
  # The one Xcode the app is built with (ios/README.md), by its path on the runner's image.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust of rust-toolchain.toml, with the iPhone's target
        working-directory: device-core
        run: rustup toolchain install && rustup target add aarch64-apple-ios
      - name: Build device-core/ for the iPhone
        working-directory: ios
        run: ./build-core.sh device
      - name: Archive the test app and check it
        working-directory: ios
        run: ./archive.sh --test-app "$RUNNER_TEMP/IamrealApp.xcarchive" "$((GITHUB_RUN_NUMBER + 1000000))"
      - name: Pack the archive, keeping its files' modes, with the export options
        run: mkdir "$RUNNER_TEMP/ios-upload" && tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/ios-upload/IamrealApp.xcarchive.tar" IamrealApp.xcarchive && cp ios/ExportOptions.plist "$RUNNER_TEMP/ios-upload/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-upload
          path: ${{ runner.temp }}/ios-upload
          if-no-files-found: error

  upload:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    environment: app-test
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-upload
          path: ${{ runner.temp }}/ios-upload
      - name: Unpack the archive
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/ios-upload/IamrealApp.xcarchive.tar"
      # The archive is unsigned and names no team: the export is told which, from the
      # environment's variable APPLE_TEAM_ID (not a key; every signed app shows it).
      - name: Name the team in the export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: test -n "$APPLE_TEAM_ID" && plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ios-upload/ExportOptions.plist"
      # The key to a file only this job's runner has, then Xcode's export: it fetches the
      # profile and the cloud-managed certificate with the key, signs, and uploads
      # (ExportOptions.plist: destination upload).
      - name: Sign and upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: umask 077 && printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/key.p8" && xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/IamrealApp.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ios-upload/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/key.p8" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
