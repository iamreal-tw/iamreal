# Checks the test site from outside Cloudflare every hour (#53, and the
# notification part of #413): worker/test/outside-check.ts sends GET requests only, to
# test.iamreal.tw and test-data.iamreal.tw, and fails when the back end does
# not answer, today's proof log was not published, the CRL mirror is more than
# a day behind, or today's card state file is missing. A failed run is the
# operator's notification: GitHub emails it (.github/README.md says to whom,
# and what this does not catch). It prints only which check failed.
#
# No secret, a token that can only read, no cache. The packages are installed
# as deploy-test.yml's upload installs wrangler: no install script, no
# .pnpmfile.cjs, the worker package only. worker/test/workflows.ts holds this
# file's job, exactly, and worker/test/workflows.test.ts checks this file
# against it.
name: watch-test

on:
  # Minute 17, not 0: GitHub may delay or drop scheduled runs at the start of every hour.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# No cache is restored or saved, by any step (GitHub's "Workflow syntax",
# cache-mode; .github/README.md).
cache-mode: none

# One run at a time; a run that has not ended is not cancelled.
concurrency:
  group: watch-test
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ pnpm@10.16.1
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org/ --filter iamreal-worker
      - name: Check the test site from outside Cloudflare
        working-directory: worker
        run: node --experimental-strip-types test/outside-check.ts
