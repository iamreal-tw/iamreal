[package]
name = "iamreal-device-core"
description = "The half of device-core/ that links Barretenberg, and the C functions the apps call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib: what the apps link. rlib: what tests/ uses.
crate-type = ["staticlib", "rlib"]

[features]
# For this directory's tests only: makes `pub` what lets a caller open a
# session that trusts other issuer keys, and reach Poseidon2 and the tree
# without a session. The library the apps link is built without it, so
# Rust code that depends on this crate gets the C functions and nothing
# else, unless it turns this feature on itself (README.md, "檢查都通過了").
testing = []
# For the apps' tests in a simulator, where a card made of test keys does a
# card proof: adds the C function idc_testing_session_open, which opens a
# session that trusts the issuer keys its caller gives, and nothing else.
# What `testing` makes `pub` stays private. The library of an app that
# goes out is built without it.
test-issuers = []

[dependencies]
iamreal-device-checks = { path = "../checks" }
acvm.workspace = true
barretenberg-rs.workspace = true
base64.workspace = true
bn254_blackbox_solver.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# The tests of tests/ are built against the library with both features.
iamreal-device-core = { path = ".", features = ["testing", "test-issuers"] }
