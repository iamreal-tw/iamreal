{{define "layout" -}}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{- if .OGTitle}}
<meta property="og:title" content="{{.Title}}">
<meta property="og:site_name" content="島民 iamreal.tw">
{{- end}}
<link rel="stylesheet" href="{{.CSS}}">
</head>
<body class="{{.Kind}}">
{{- if .TestRoster}}
<p class="test-roster">測試名冊</p>
{{- end}}
<main>
<header class="top">
<a href="/">{{template "logo"}}<b>島民</b><span>iamreal.tw</span></a>
</header>
{{template "content" .Content}}
<footer class="foot">
<a href="/roster">名冊</a>
<a href="/faq">常見問題</a>
<a href="/verify">怎麼驗證</a>
<a href="https://github.com/iamreal-tw/iamreal">GitHub</a>
</footer>
</main>
</body>
</html>
{{end}}
